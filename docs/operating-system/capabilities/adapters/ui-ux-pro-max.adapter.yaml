project: SlipGuard
capability_id: nextlevelbuilder/ui-ux-pro-max-skill/ui-ux-pro-max
authorization: PILOT
authority_weight: supporting
availability: INSTALLED_CALLABLE
local_enablement: >
  Available via Claude Code plugin marketplace at user/global scope only
  (~/.claude/settings.json enabledPlugins:
  "ui-ux-pro-max@ui-ux-pro-max-skill": true, version 2.11.0,
  gitCommitSha 1307d97a72e6c1cda572cb65471ae5ce82995218). NOT separately
  listed in SlipGuard's own .claude/settings.local.json enabledPlugins —
  SlipGuard inherits availability from the global install rather than
  pinning it project-locally. Directly re-verified 2026-08-09.
project_restrictions: >
  Reference and inspiration only, never a source of committed code or
  assets (CLAUDE.md's Tool Invocation Policy, TOOL-UX-001). Every
  recommendation is advisory until reconciled against SlipGuard's own
  repository evidence and UX Constitution (docs/05-ux/) and may never be
  treated as an adopted design decision on its own authority
  (DESIGN-CAPABILITY-MATRIX.md, Prohibited Overlap #8). Primary capability
  for exactly one responsibility (accessibility guidance) per
  DESIGN-CAPABILITY-MATRIX.md's Responsibility Matrix; Supporting for
  every other responsibility it appears against there (user journey,
  information architecture, workflow sequencing, progressive disclosure,
  product-interface composition) — this record's overall
  authority_weight of "supporting" reflects the general case, not the one
  accessibility-guidance exception, which a future consumer of this record
  should check DESIGN-CAPABILITY-MATRIX.md directly for rather than assume
  from this field alone. Must validate stack relevance before any
  recommendation is applied (CAPABILITY-REGISTRY.md's Active Pilot
  restrictions row).
project_overrides: NOT_RECORDED
version_constraint: NOT_RECORDED
project_specific_context: >
  docs/05-ux/ (UX Constitution), docs/design-intelligence/PROJECT-DESIGN-CONTEXT.md,
  CLAUDE.md's Mandatory Specialist Design Capability Invocation section.
evidence_channels:
  - kind: general
    location: "CHANGELOG.md Specialist Design Capability Usage sections"
    purpose: "General/project-wide design-capability evidence, SlipGuard's own pre-existing convention."
  - kind: integration
    location: docs/operating-system/capabilities/adapters/evidence/
    purpose: "Structured resolution/invocation records for capability-system integration work specifically (CAPSYS-P2)."
notes: >
  SlipGuard's own CAPABILITY-REGISTRY.md status for this capability is
  "Active Pilot" (pilot started 2026-08-06, review date 2026-09-05) —
  mapped here to the central vocabulary's PILOT value. This corrects a
  looser mapping used in the central repository's own illustrative example
  (capability-system's adapters/examples/slipguard.example.yaml, authored
  during CAPSYS-P1 as a non-binding reconstruction, which used APPROVED).
  That illustrative file is not authoritative over this real record; this
  file is SlipGuard's own, and "Active Pilot" maps most precisely to
  PILOT, not APPROVED, under the central vocabulary's own definitions.

  (`CAPSYS-P5A`, 2026-08-09): the single free-text `evidence_location`
  field this record originally carried (`CAPSYS-P2`) is migrated to the
  structured `evidence_channels` list above, following the central
  contract's retirement of `evidence_location` (`CS-DEC-020`,
  `adapters/CONTRACT.md`'s "Evidence channels" section). The two channels
  represented are the same two real locations this record already
  described — CHANGELOG.md's narrative convention and this project's own
  structured integration-evidence directory — restructured, not changed
  in substance. No other field on this adapter was altered by this
  migration.

  (`CAPSYS-P17`, 2026-08-10): adds the structured `availability` field
  this record previously lacked, per the central contract's
  `governance/STATE_MODEL.md` Dimension 2 vocabulary
  (`schemas/adapter.schema.yaml`, `CS-DEC-022`/`CS-DEC-027`). Value
  `INSTALLED_CALLABLE`, grounded in a fresh, direct re-verification on
  2026-08-10 of exactly the same facts `local_enablement` above already
  documents: the plugin cache directory and its one installed version
  (2.11.0) present, `~/.claude/settings.json`'s `enabledPlugins` entry
  ("ui-ux-pro-max@ui-ux-pro-max-skill": true) and `installed_plugins.json`
  (scope "user", gitCommitSha `1307d97a72e6c1cda572cb65471ae5ce82995218`)
  both confirmed unchanged, and a real, direct invocation of the
  capability's own bundled `search.py` (its documented query mechanism)
  completing successfully. Not inferred from `local_enablement`'s prose
  alone — independently re-checked against the live environment.
  `authorization`, `authority_weight`, `local_enablement`,
  `project_restrictions`, `project_overrides`, `version_constraint`,
  `project_specific_context`, and `evidence_channels` are all otherwise
  unchanged by this edit.
