# OP-01 (RC1 Operations Programme) — Nginx server block template.
#
# Prepared, not deployed to a real server in this pass (none exists — see
# docs/08-operations/RC1_OPERATIONS_PROGRAMME.md). Standard Laravel/Nginx
# configuration, sized to a single VPS per the Production Operations
# Blueprint §O-01 — no exotic configuration.
#
# Install: copy to /etc/nginx/sites-available/slipguard, replace
# `your-domain.example.com`, symlink into sites-enabled, `nginx -t`, then
# `systemctl reload nginx`. Run `certbot --nginx -d your-domain.example.com`
# (ops/provision-server.sh's own follow-up step) to add the SSL block —
# deliberately not hand-written here, since certbot's own generated
# configuration is the source of truth for certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    root /var/www/slipguard/current/public;
    index index.php;

    charset utf-8;

    # Points at the deploy user's home so the app's own storage/logs symlink
    # (shared/storage, see ops/deploy.sh) is readable by the web server user.
    client_max_body_size 12M; # matches the 10MB upload validation limit
                               # (BettingSlipIntake, PO-MVP-005 §7.8) plus headroom

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/slipguard-access.log;
    error_log /var/log/nginx/slipguard-error.log;
}
