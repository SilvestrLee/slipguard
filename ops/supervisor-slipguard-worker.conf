; OP-01/OP-03 (RC1 Operations Programme) — queue worker supervision.
;
; Prepared, not installed anywhere — no production server exists yet.
;
; Deliberately NOT required for RC1: direct code search found zero queued
; jobs anywhere in this application today (no app/Jobs, no ShouldQueue
; usage — docs/08-operations/PRODUCTION_OPERATIONS_BLUEPRINT.md §O-01
; already established this). Installing this now is harmless (a worker
; with nothing to process simply idles) and means the first real queued
; job doesn't also require a same-day Operations change to start
; processing it.
;
; Install: copy to /etc/supervisor/conf.d/slipguard-worker.conf on the
; production server, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start slipguard-worker:*

[program:slipguard-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/slipguard/current/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=slipguard
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/slipguard/shared/storage/logs/worker.log
stopwaitsecs=3600
